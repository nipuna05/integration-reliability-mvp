<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Integration Reliability</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#6b7686; --ok:#1a7f4b; --bad:#c62828; --line:#e3e6eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1b212a; --text:#e6e9ee; --muted:#8c96a5; --ok:#4cc38a; --bad:#ff6b6b; --line:#2a323d; } }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  main { max-width:860px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; font:inherit; }
  button.primary { background:var(--text); color:var(--bg); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .pill { font-weight:600; font-size:13px; padding:2px 10px; border-radius:99px; }
  .ok { color:var(--ok); border:1px solid var(--ok); } .bad { color:var(--bad); border:1px solid var(--bad); }
  .steps { margin:10px 0 0; padding:0; list-style:none; font-size:14px; }
  .steps li { padding:2px 0; } .fail { color:var(--bad); }
  .muted { color:var(--muted); font-size:13px; }
  .spark { display:flex; gap:3px; margin-top:10px; } .spark i { width:10px; height:18px; border-radius:2px; background:var(--ok); } .spark i.bad { background:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Integration Reliability</h1>
  <p class="sub">Business-transaction checks across systems — not just "is the API up".</p>
  <div class="bar">
    <button class="primary" id="run">Run checks now</button>
    <button id="break">Simulate silent sync bug</button>
    <button id="fix">Fix sync</button>
    <span class="muted" id="state" style="align-self:center"></span>
  </div>
  <div id="list"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function render() {
  const [checks, history, demo] = await Promise.all(['/api/checks', '/api/history', '/demo/state'].map((u) => fetch(u).then((r) => r.json())));
  $('state').textContent = demo.broken ? 'Demo sync: BROKEN' : 'Demo sync: healthy';
  $('list').innerHTML = checks.map((c) => {
    const runs = history.filter((h) => h.id === c.id);
    const last = runs[0];
    const status = !last ? '<span class="muted">not run yet</span>'
      : `<span class="pill ${last.ok ? 'ok' : 'bad'}">${last.ok ? 'PASSING' : 'FAILING'}</span>`;
    const steps = last ? `<ul class="steps">${last.steps.map((s) =>
      `<li class="${s.ok ? '' : 'fail'}">${s.ok ? '✓' : '✗'} ${esc(s.name)} <span class="muted">${s.ms}ms</span>${s.ok ? '' : '<br>&nbsp;&nbsp;' + s.failures.map(esc).join('<br>&nbsp;&nbsp;')}</li>`).join('')}</ul>` : '';
    const spark = `<div class="spark">${runs.slice(0, 30).reverse().map((r) => `<i class="${r.ok ? '' : 'bad'}" title="${r.at}"></i>`).join('')}</div>`;
    return `<div class="card"><div class="row"><strong>${esc(c.name)}</strong>${status}</div>
      ${last ? `<div class="muted">last run ${new Date(last.at).toLocaleTimeString()} · ${last.ms}ms</div>` : ''}${steps}${spark}</div>`;
  }).join('');
}

$('run').onclick = async () => { $('run').disabled = true; await fetch('/api/run', { method: 'POST' }); $('run').disabled = false; render(); };
const setBroken = (broken) => async () => { await fetch('/demo/break', { method: 'POST', body: JSON.stringify({ broken }) }); render(); };
$('break').onclick = setBroken(true);
$('fix').onclick = setBroken(false);
render(); setInterval(render, 10000);
</script>
</body>
</html>
